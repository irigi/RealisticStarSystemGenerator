[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "starsys"
version = "0.1.0"
description = "Scientifically grounded star-system generator for worldbuilding."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "numba>=0.60",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.5", "lightgbm>=4.3"]
astro = ["astropy>=6.1", "astroquery>=0.4.7", "tess-point>=0.9"]
dev = ["pytest>=8.0", "matplotlib>=3.9", "gdown>=5.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
