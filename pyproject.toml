[project]
name = "realistic-star-system-generator"
version = "0.1.0"
description = "Hierarchical neural generator for SysSim exoplanet system catalogs."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

